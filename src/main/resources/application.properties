spring.application.name=turboBot
# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (use DEFAULT path first to test)
spring.h2.console.enabled=true

# Server
server.port=8085
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Debug: Enable to see servlet registration
#logging.level.org.springframework.boot.autoconfigure.h2=DEBUG

# Optional: automatically create/update schema
spring.jpa.hibernate.ddl-auto=update


